<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/stylesheet.css">
    <link rel="icon" type="image/x-icon" href="assets/images/icon.png">
    <title>To-Do List</title>
</head>
<body>  
    <main class="container">
        <section class="todo-app" aria-labelledby="page-title">
            <h1 id="page-title">Todo List <img src="assets/images/icon.png" alt=""></h1>
            <form class="row" id="task-form">
                <label class="sr-only" for="input-box">New task</label>
                <input type="text" id="input-box" placeholder="Add a new task..." autocomplete="off" required>
                <button type="submit">Add task</button>
            </form>
            <p class="empty-state" id="empty-state">Your task list is empty.</p>
            <ul id="list-container" aria-live="polite"></ul>
        </section>
    </main>
    <script src="js/script.js"></script>
    
</body>
</html>
